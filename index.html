<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>War Robots Wordle</title>
  <meta name="title" content="War Robots Wordle">
  <meta name="description" content="Guess robot in 6 tries! A wordle game for WR fans.">
  <meta name="theme-color" content="#ffcc00">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://j0bl3ss.github.io/WarRobotsWordle/">
  <meta property="og:title" content="War Robots Wordle">
  <meta property="og:description" content="Guess robot in 6 tries! A wordle game for WR fans.">
  <meta property="og:image" content="https://media.discordapp.net/attachments/915282146262913117/1497613131701157968/WRRdle.png">

  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://j0bl3ss.github.io/WarRobotsWordle/">
  <meta property="twitter:title" content="War Robots Wordle">
  <meta property="twitter:description" content="Guess robot in 6 tries! A wordle game for WR fans.">
  <meta property="twitter:image" content="https://media.discordapp.net/attachments/915282146262913117/1497613131701157968/WRRdle.png">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>WRR<span>.</span>dle</h1>
    <p>War Robots Wordle</p>
  </header>
  <div class="meta-bar">
    <span>Attempts</span>
    <div class="attempts-dots" id="dots"></div>
  </div>
  <div id="result-banner"></div>
  <div class="input-area">
    <div id="search-wrap">
      <input type="text" id="robot-input" placeholder="Type robot name..." autocomplete="off" spellcheck="false">
      <div id="autocomplete"></div>
    </div>
    <button id="guess-btn">Guess</button>
    <button id="new-game-btn">New</button>
    <label class="mode-toggle" title="Hard Mode hides the Tier column">
      <input type="checkbox" id="hard-mode-toggle">
      <span class="mode-label" id="mode-label-text">Easy</span>
    </label>
  </div>
  <div class="grid-container">
    <div id="grid-bg"></div>
    <div class="grid-header">
      <span>Robot</span>
      <span class="header-tier">Tier</span>
      <span>Faction</span>
      <span>Light</span>
      <span>Medium</span>
      <span>Heavy</span>
    </div>
    <div id="guess-rows"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
